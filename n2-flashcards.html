<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>แฟลชการ์ด N2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday study tool, friendly but tidy
   IDEA a Japanese 単語帳: ring-bound word cards flipped on the train
   PICTURE the card itself, large, with a ring hole and a stamp when learned
   COLOUR indigo ai band, white card, vermilion shu accent, leaf green for "learned"
   TYPE Zen Maru Gothic for Japanese + Noto Sans Thai
   LAYOUT title + filters on indigo band, card centred below, controls under it; phone: same order stacked */
:root{color-scheme:light dark;--bg:light-dark(#f4f5f8,#0e1424);--band:light-dark(#3d2457,#2a1840);--card:light-dark(#ffffff,#1c2742);--ink:light-dark(#141a2b,#eef1f8);--soft:light-dark(#5b6479,#a8b1c8);--line:light-dark(#d9dde6,#2e3b5c);--shu:#d7372b;--ok:light-dark(#1f8a4c,#4cc283);--chip:light-dark(#ffffff22,#ffffff1a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans Thai","Zen Maru Gothic",system-ui,sans-serif;overflow-x:clip}
.jp{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif}
.band{background:var(--band);color:#fff;padding:22px max(5vw,16px) 18px}
.top{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
h1{margin:0;font:700 clamp(28px,4vw,40px)/1.1 "Zen Maru Gothic","Noto Sans Thai",sans-serif;letter-spacing:-.01em}
h1 small{display:block;font:500 15px/1.4 "Noto Sans Thai",sans-serif;opacity:.8;margin-top:6px;letter-spacing:0}
.tabs{display:flex;gap:4px;background:#ffffff1f;padding:4px;border-radius:999px}
.tabs button{border:0;background:none;color:#fff;font:500 15px "Noto Sans Thai",sans-serif;padding:10px 16px;border-radius:999px;cursor:pointer;min-height:44px}
.tabs button[aria-pressed=true]{background:#fff;color:var(--band)}
.chips{max-width:1100px;margin:16px auto 0;display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chips button{flex:none;border:1px solid #ffffff40;background:var(--chip);color:#fff;border-radius:999px;padding:8px 14px;font:500 14px "Noto Sans Thai",sans-serif;cursor:pointer;min-height:40px;white-space:nowrap}
.chips button[aria-pressed=true]{background:#fff;color:var(--band);border-color:#fff}
.chips b{font-weight:500;opacity:.65;margin-left:4px}
main{max-width:1100px;margin:0 auto;padding:22px max(4vw,16px) 48px}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:16px}
.prog{flex:1 1 260px;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--soft)}
.track{flex:1;height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.track i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.tog{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:14px "Noto Sans Thai",sans-serif;cursor:pointer;min-height:40px}
.tog[aria-pressed=true]{border-color:var(--band);box-shadow:inset 0 0 0 1px var(--band);color:light-dark(var(--band),#cfe0ff)}
.stage{perspective:1400px;max-width:620px;margin:0 auto}
.card{position:relative;height:clamp(300px,52vh,400px);cursor:pointer;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 2px 0 var(--line),0 14px 30px -18px #0f1c3a66;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px;text-align:center}
.back{transform:rotateY(180deg)}
.face::before{content:"";position:absolute;left:22px;top:22px;width:16px;height:16px;border-radius:50%;background:var(--bg);box-shadow:inset 0 2px 3px #0003}
.cat{position:absolute;right:20px;top:18px;font-size:13px;color:var(--soft)}
.num{position:absolute;left:48px;top:18px;font-size:13px;color:var(--soft)}
.read{font-size:clamp(17px,3vw,22px);color:var(--soft);min-height:1.4em}
.word{font-weight:700;font-size:clamp(40px,10vw,76px);line-height:1.15;letter-spacing:-.01em;overflow-wrap:anywhere}
.word.long{font-size:clamp(28px,7vw,48px)}
.roma{font-size:16px;color:var(--soft);margin-top:6px;min-height:1.5em}
.th{font-weight:700;font-size:clamp(28px,6vw,42px);line-height:1.25}
.back .word{font-size:clamp(24px,5vw,34px);margin-top:14px}
.hint{position:absolute;bottom:16px;font-size:13px;color:var(--soft)}
.stamp{position:absolute;right:22px;bottom:18px;width:64px;height:64px;border:3px solid var(--shu);color:var(--shu);border-radius:50%;display:grid;place-items:center;font:900 15px/1 "Zen Maru Gothic",sans-serif;transform:rotate(-14deg);opacity:0;transition:opacity .2s}
.known .stamp{opacity:.85}
.say{position:absolute;right:16px;bottom:14px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.front .say{left:16px;right:auto}
.say svg{width:20px;height:20px}
.ctl{max-width:620px;margin:18px auto 0;display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto;gap:10px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;min-height:52px;padding:0 16px;font:500 16px "Noto Sans Thai",sans-serif;cursor:pointer}
.btn:hover{border-color:var(--soft)}
.btn.no{border-color:var(--shu);color:var(--shu)}
.btn.yes{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible{outline:3px solid #f2a33a;outline-offset:2px}
.keys{text-align:center;font-size:13px;color:var(--soft);margin-top:12px}
.empty{max-width:620px;margin:0 auto;background:var(--card);border:1px dashed var(--line);border-radius:22px;padding:40px 24px;text-align:center}
.q{max-width:620px;margin:0 auto}
.q .face{position:relative;height:auto;min-height:220px;backface-visibility:visible}
.ans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.ans button{text-align:left;min-height:60px;padding:10px 14px;font-size:17px}
.ans button.r{background:var(--ok);border-color:var(--ok);color:#fff}
.ans button.w{border-color:var(--shu);color:var(--shu);background:color-mix(in srgb,var(--shu) 10%,var(--card))}
.score{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:15px;color:var(--soft);gap:10px;flex-wrap:wrap}
.search{width:100%;max-width:420px;font:16px "Noto Sans Thai",sans-serif;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:46px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--soft);font-weight:500}
tbody tr{cursor:pointer}
tbody tr:hover{background:color-mix(in srgb,var(--band) 7%,var(--card))}
td.w{font-size:20px;font-weight:700}
td.ok{color:var(--ok);font-weight:700;white-space:nowrap}
.stars{position:absolute;right:20px;top:14px;font-size:19px;letter-spacing:2px;color:var(--shu)}
.stars i{font-style:normal;color:var(--line)}
.kb{display:inline-flex;align-items:baseline;gap:8px;margin-top:10px;font-size:13px;color:var(--soft);border:1px dashed var(--soft);border-radius:8px;padding:3px 10px}
.kb b{font-family:"Zen Maru Gothic",sans-serif;color:var(--ink);font-size:18px;font-weight:700}
.chips.sub{margin-top:8px}
.chips .sep{flex:none;width:1px;background:#ffffff40;margin:6px 4px}
td.st{color:var(--shu);white-space:nowrap}
td small{color:var(--soft)}
.qmode{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
.tform{display:flex;gap:10px;margin-top:14px}
.tform input{flex:1;font:20px "Zen Maru Gothic",sans-serif;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:52px}
.tres{margin-top:12px;font-size:17px;min-height:1.6em;text-align:center}
.tres .ok{color:var(--ok);font-weight:700}.tres .ng{color:var(--shu);font-weight:700}
.note{margin-top:12px;font-size:15px;color:var(--soft)}
.note b{font-family:"Zen Maru Gothic",sans-serif;color:var(--ink);font-weight:700}
[hidden]{display:none!important}
@media(max-width:600px){.ctl{grid-template-columns:repeat(2,minmax(0,1fr))}.ctl .prev{order:3}.ctl .next{order:4}.ans{grid-template-columns:minmax(0,1fr)}table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding:8px 0}.stack td{border:0;padding:2px 12px}.stack td.w{font-size:22px}.keys{display:none}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<header class="band">
  <div class="top">
    <h1>คำศัพท์ภาษาญี่ปุ่น N2<small>แตะการ์ดเพื่อดูคำแปล · ★ = ความถี่ที่ออกสอบ N2 (ประมาณการ)</small></h1>
    <div class="tabs" role="group" aria-label="โหมด">
      <button id="t-card" aria-pressed="true">การ์ด</button>
      <button id="t-quiz" aria-pressed="false">ควิซ</button>
      <button id="t-list" aria-pressed="false">รายการคำ</button>
    </div>
  </div>
  <div class="chips" id="chips" role="group" aria-label="หมวดหมู่"></div>
  <div class="chips sub" id="chips2" role="group" aria-label="กลุ่มคำ"></div>
</header>
<main>
  <div class="bar">
    <div class="prog"><span id="pt">จำได้แล้ว 0/0</span><div class="track"><i id="pb"></i></div></div>
    <div class="opts">
      <button class="tog" id="o-dir" aria-pressed="false">ไทย → ญี่ปุ่น</button>
      <button class="tog" id="o-read" aria-pressed="false">คำอ่าน</button>
      <button class="tog" id="o-roma" aria-pressed="false">โรมาจิ</button>
      <button class="tog" id="o-left" aria-pressed="false">เฉพาะคำที่ยังจำไม่ได้</button>
      <button class="tog" id="o-shuf">สุ่มลำดับ</button>
    </div>
  </div>

  <section id="v-card">
    <div class="stage" id="stage">
      <div class="card" id="card" tabindex="0" aria-live="polite">
        <div class="face front"><span class="num" id="f-num"></span><span class="stars" id="f-st"></span><div id="f-body"></div><button class="say" id="say1" aria-label="ฟังเสียง"></button><span class="hint">แตะเพื่อพลิก</span></div>
        <div class="face back"><span class="num" id="b-num"></span><span class="stars" id="b-st"></span><div id="b-body"></div><div class="stamp">覚えた</div><button class="say" id="say2" aria-label="ฟังเสียง"></button></div>
      </div>
    </div>
    <div class="empty" id="empty" hidden></div>
    <div class="ctl" id="ctl">
      <button class="btn prev" id="prev" aria-label="คำก่อนหน้า">←</button>
      <button class="btn no" id="no">ยังจำไม่ได้</button>
      <button class="btn yes" id="yes">จำได้แล้ว</button>
      <button class="btn next" id="next" aria-label="คำถัดไป">→</button>
    </div>
    <p class="keys">คีย์ลัด: Space พลิก · ← → เปลี่ยนคำ · ↑ จำได้แล้ว · ↓ ยังจำไม่ได้ · S ฟังเสียง</p>
  </section>

  <section id="v-quiz" hidden>
    <div class="q">
      <div class="qmode" role="group" aria-label="แบบควิซ"><button class="tog" id="qm-mc" aria-pressed="true">เลือกความหมาย</button><button class="tog" id="qm-ty" aria-pressed="false">พิมพ์คำอ่าน (漢字読み)</button></div>
      <div class="face"><span class="cat" id="q-cat"></span><div id="q-body"></div><button class="say" id="say3" aria-label="ฟังเสียง"></button></div>
      <div class="ans" id="ans"></div>
      <form class="tform" id="tform" hidden><input id="tin" type="text" lang="ja" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="พิมพ์คำอ่านเป็นฮิรางานะ"><button class="btn yes" type="submit">ตรวจ</button></form>
      <div class="tres" id="tres" aria-live="polite"></div>
      <div class="score"><span id="q-score">ถูก 0 จาก 0 ข้อ</span><button class="btn" id="q-next">ข้อต่อไป →</button></div>
    </div>
  </section>

  <section id="v-list" hidden>
    <p><input class="search" id="search" type="search" placeholder="ค้นหา: ญี่ปุ่น ไทย หรือโรมาจิ"></p>
    <div class="scroll"><table class="stack"><thead><tr><th>คำ</th><th>คำอ่าน</th><th>ความหมาย</th><th>หมวด</th><th>ความถี่</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
  </section>
</main>
<script>
{
const CATS={k:"คำนาม (คันจิ)",w:"คำกริยา",f:"กริยาผสม",a:"คุณศัพท์",d:"คำวิเศษณ์",o:"คำเลียนเสียง",t:"คาตาคานะ",g:"คำเติมหน้า-หลัง"};
const GN={g1:"กลุ่ม 1 คำออกบ่อย",g2:"กลุ่ม 2 คำลึก"};
const RAW=`影響|えいきょう|อิทธิพล, ผลกระทบ|k|3|
効果|こうか|ผล, ประสิทธิผล|k|3|
原因|げんいん|สาเหตุ|k|3|
条件|じょうけん|เงื่อนไข|k|3|

状況|じょうきょう|สถานการณ์|k|3|

検討|けんとう|การพิจารณา|k|3|
判断|はんだん|การตัดสิน, วินิจฉัย|k|3|

調査|ちょうさ|การสำรวจ, การสอบสวน|k|3|

観察|かんさつ|การสังเกต|k|2|

    let r;
    if(M[c]!==undefined&&SM[nx]&&!"ゃゅょぁぃぅぇぉ".includes(c)){
      const b=M[c];
      r=/^(sh|ch|j|f|ts)/.test(b)||"ぁぃぅぇぉ".includes(nx)?b.slice(0,-1)+SM[nx]:b.slice(0,-1)+"y"+SM[nx];k++;
    }else if(M[c]!==undefined)r=M[c];
    else r=PUNCT[c]??c;
    if(dbl&&/^[a-z]/.test(r)){o+=r.startsWith("ch")?"t":r[0];}
    dbl=false;o+=r;
  }
  return o;
}
W.forEach(x=>{x.ro=romaji(x.r||x.w);x.kj=/[一-鿿]/.test(x.w)});
const KEY="n2known";
let known=new Set();
try{known=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...known]))}catch(e){}};
let cat="all",grp="all",order=[...W].sort((a,b)=>(a.g>b.g)-(a.g<b.g)||b.st-a.st||a.i-b.i).map(x=>x.i),pos=0,flipped=false,mode="card",qmode="mc";
const opt={dir:false,read:false,roma:false,left:false};
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const match=x=>(cat==="all"||x.c===cat)&&(grp==="all"||(grp==="s3"?x.st===3:x.g===grp));
const pool=()=>order.map(i=>W[i]).filter(x=>match(x)&&(!opt.left||!known.has(x.w)));
const inCat=()=>W.filter(match);
const starH=n=>"★".repeat(n)+`<i>${"★".repeat(3-n)}</i>`;
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
["say1","say2","say3"].forEach(id=>$(id).innerHTML=SPK);
function speak(x){
  try{
    const u=new SpeechSynthesisUtterance((x.r||x.w).replace(/〜/g,""));
    u.lang="ja-JP";u.rate=.85;
    const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith("ja"));if(v)u.voice=v;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
}
function chips(){
  const counts={};W.forEach(x=>counts[x.c]=(counts[x.c]||0)+1);
  const list=[["all","ทั้งหมด",W.length],...Object.keys(CATS).map(k=>[k,CATS[k],counts[k]||0])];
  $("chips").innerHTML=list.map(([k,n,c])=>`<button data-c="${k}" aria-pressed="${k===cat}">${n}<b>${c}</b></button>`).join("");
  const gl=[["all","ทุกกลุ่ม",W.length],["g1","กลุ่ม 1 คำออกบ่อย (★★–★★★)",W.filter(x=>x.g==="g1").length],["g2","กลุ่ม 2 คำลึก (★)",W.filter(x=>x.g==="g2").length],["s3","เฉพาะ ★★★",W.filter(x=>x.st===3).length]];
  $("chips2").innerHTML=gl.map(([k,n,c])=>`<button data-g="${k}" aria-pressed="${k===grp}">${n}<b>${c}</b></button>`).join("");
}
function progress(){
  const s=inCat(),k=s.filter(x=>known.has(x.w)).length;
  $("pt").textContent=`จำได้แล้ว ${k}/${s.length}`;
  $("pb").style.width=(s.length?k/s.length*100:0)+"%";
}
function wordHTML(x,big,all){
  const cls=big&&x.w.length>6?"word jp long":"word jp";
  const top=(all||opt.read)&&x.r?esc(x.r):"";
  return `<div class="read jp">${top}</div><div class="${cls}">${esc(x.w)}</div><div class="roma">${(all&&opt.roma)||(!all&&opt.roma)?esc(x.ro):""}</div>`;
}
const noteH=x=>x.note?`<div class="note jp">${esc(x.note).replace(/(≈|↔)\s*/,'$1 <b>')+"</b>"}</div>`:"";
function render(){
  const p=pool();
  progress();
  const empty=!p.length;
  $("stage").hidden=$("ctl").hidden=empty;$("empty").hidden=!empty;
  if(empty){$("empty").innerHTML=inCat().length?"<p><b>เก่งมาก! คำในตัวกรองนี้จำได้ครบแล้ว</b></p><p>ปิด “เฉพาะคำที่ยังจำไม่ได้” เพื่อทบทวนทั้งหมด หรือเลือกกลุ่มถัดไป</p>":"<p><b>ไม่มีคำที่ตรงกับตัวกรองนี้</b></p><p>ลองเลือกหมวดหรือกลุ่มอื่น</p>";return}
  if(pos>=p.length)pos=0;if(pos<0)pos=p.length-1;
  const x=p[pos];
  $("card").classList.toggle("flip",flipped);
  $("card").classList.toggle("known",known.has(x.w));
  $("f-num").textContent=$("b-num").textContent=`${pos+1} / ${p.length} · ${CATS[x.c]}`;
  $("f-st").innerHTML=$("b-st").innerHTML=starH(x.st);
  $("f-st").title=$("b-st").title=`ความถี่ที่ออกสอบ ${x.st}/3 · ${GN[x.g]}`;
  const th=`<div class="th">${esc(x.th)}</div>`;
  const jpBack=`<div class="read jp">${x.r?esc(x.r):""}</div><div class="word jp">${esc(x.w)}</div><div class="roma">${opt.roma?esc(x.ro):""}</div>`;
  if(!opt.dir){$("f-body").innerHTML=wordHTML(x,true);$("b-body").innerHTML=th+jpBack+noteH(x);$("say1").hidden=false}
  else{$("f-body").innerHTML=th;$("b-body").innerHTML=jpBack+noteH(x);$("say1").hidden=true}
}
function go(d){flipped=false;pos+=d;render()}
function mark(k){
  const x=pool()[pos];if(!x)return;
  k?known.add(x.w):known.delete(x.w);save();
  if(opt.left&&k){flipped=false;render()}else go(1);
}
function shuffle(){
  for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
  pos=0;flipped=false;render();if(mode==="quiz")quiz();
}
/* quiz */
let qx=null,qs={ok:0,n:0},answered=false;
const hira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96)).replace(/[\s〜~・]/g,"");
function quiz(){
  let p=pool().length?pool():inCat();
  if(qmode==="ty"){const k=p.filter(x=>x.kj);p=k.length?k:inCat().filter(x=>x.kj)}
  if(!p.length){$("q-body").innerHTML="<p>ไม่มีคำที่มีคันจิในตัวกรองนี้</p>";$("ans").innerHTML="";return}
  qx=p[Math.floor(Math.random()*p.length)];answered=false;
  $("q-cat").textContent=CATS[qx.c];
  $("tres").innerHTML="";
  $("ans").hidden=qmode==="ty";$("tform").hidden=qmode!=="ty";
  if(qmode==="ty"){
    $("q-body").innerHTML=`<div class="read jp"></div><div class="word jp${qx.w.length>6?" long":""}">${esc(qx.w)}</div><div class="roma"></div>`;
    $("say3").hidden=true;$("tin").value="";
    try{$("tin").focus({preventScroll:true})}catch(e){}
    return;
  }
  let src=inCat().filter(x=>x.th!==qx.th);if(src.length<3)src=W.filter(x=>x.th!==qx.th);
  const opts=[qx];
  while(opts.length<4){const y=src[Math.floor(Math.random()*src.length)];if(!opts.some(o=>o.th===y.th))opts.push(y)}
  opts.sort(()=>Math.random()-.5);
  $("q-body").innerHTML=opt.dir?`<div class="th">${esc(qx.th)}</div>`:wordHTML(qx,true);
  $("say3").hidden=opt.dir;
  $("ans").innerHTML=opts.map((o,k)=>`<button class="btn" data-k="${o.i}"><span class="${opt.dir?"jp":""}">${k+1}. ${esc(opt.dir?o.w:o.th)}</span></button>`).join("");
}
function score(right){
  qs.n++;if(right){qs.ok++;known.add(qx.w);save();progress()}
  $("q-score").textContent=`ถูก ${qs.ok} จาก ${qs.n} ข้อ`;
}
function answer(b){
  if(answered||!b)return;answered=true;
  const right=+b.dataset.k===qx.i;score(right);
  [...$("ans").children].forEach(el=>{if(+el.dataset.k===qx.i)el.classList.add("r");else if(el===b)el.classList.add("w")});
  if(opt.dir)$("q-body").innerHTML+=`<div class="read jp" style="margin-top:10px">${esc(qx.w)}${qx.r?" ("+esc(qx.r)+")":""}</div>`;
  else{$("q-body").querySelector(".read").textContent=qx.r||"";$("q-body").querySelector(".roma").textContent=qx.th}
}
function typed(e){
  e.preventDefault();
  if(answered){quiz();return}
  const v=hira($("tin").value.trim());if(!v)return;
  answered=true;
  const right=v===hira(qx.r||qx.w);score(right);
  $("q-body").querySelector(".read").textContent=qx.r;
  $("tres").innerHTML=(right?'<span class="ok">ถูกต้อง!</span> ':`<span class="ng">ยังไม่ใช่</span> คุณพิมพ์ <span class="jp">${esc($("tin").value)}</span> · คำอ่านที่ถูกคือ <b class="jp">${esc(qx.r)}</b><br>`)+` ${esc(qx.th)} · กด Enter เพื่อไปข้อต่อไป`;
}
/* list */
function list(){
  const q=$("search").value.trim().toLowerCase();
  const rows=order.map(i=>W[i]).filter(x=>match(x)&&(!q||(x.w+x.r+x.th+x.ro+x.note).toLowerCase().includes(q)));
  $("tb").innerHTML=rows.length?rows.map(x=>`<tr data-i="${x.i}"><td class="w jp">${esc(x.w)}${x.note?`<br><small>${esc(x.note)}</small>`:""}</td><td class="jp">${esc(x.r||"")}<br><small>${esc(x.ro)}</small></td><td>${esc(x.th)}</td><td>${CATS[x.c]}<br><small>${GN[x.g]}</small></td><td class="st">${starH(x.st)}</td><td class="ok">${known.has(x.w)?"จำได้แล้ว":""}</td></tr>`).join(""):`<tr><td colspan="6">ไม่พบคำที่ค้นหา</td></tr>`;
}
function setMode(m){
  mode=m;
  ["card","quiz","list"].forEach(k=>{$("v-"+k).hidden=k!==m;$("t-"+k).setAttribute("aria-pressed",k===m)});
  if(m==="card")render();if(m==="quiz")quiz();if(m==="list")list();
}
function refresh(){progress();if(mode==="card")render();if(mode==="quiz")quiz();if(mode==="list")list()}
/* events */
$("t-card").onclick=()=>setMode("card");$("t-quiz").onclick=()=>setMode("quiz");$("t-list").onclick=()=>setMode("list");
$("chips").onclick=e=>{const b=e.target.closest("button");if(!b)return;cat=b.dataset.c;pos=0;flipped=false;chips();refresh()};
$("chips2").onclick=e=>{const b=e.target.closest("button");if(!b)return;grp=b.dataset.g;pos=0;flipped=false;chips();refresh()};
["dir","read","roma","left"].forEach(k=>{$("o-"+k).onclick=e=>{opt[k]=!opt[k];e.currentTarget.setAttribute("aria-pressed",opt[k]);if(k==="left")pos=0;flipped=false;refresh()}});
$("o-shuf").onclick=shuffle;
$("qm-mc").onclick=()=>{qmode="mc";$("qm-mc").setAttribute("aria-pressed",true);$("qm-ty").setAttribute("aria-pressed",false);quiz()};
$("qm-ty").onclick=()=>{qmode="ty";$("qm-ty").setAttribute("aria-pressed",true);$("qm-mc").setAttribute("aria-pressed",false);quiz()};
$("tform").onsubmit=typed;
$("card").onclick=e=>{if(e.target.closest(".say"))return;flipped=!flipped;$("card").classList.toggle("flip",flipped)};
$("say1").onclick=$("say2").onclick=()=>{const x=pool()[pos];if(x)speak(x)};
$("say3").onclick=()=>qx&&speak(qx);
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
$("yes").onclick=()=>mark(true);$("no").onclick=()=>mark(false);
$("ans").onclick=e=>answer(e.target.closest("button"));
$("q-next").onclick=quiz;
$("search").oninput=list;
$("tb").onclick=e=>{const r=e.target.closest("tr[data-i]");if(!r)return;opt.left=false;$("o-left").setAttribute("aria-pressed",false);const p=pool();pos=p.findIndex(x=>x.i===+r.dataset.i);flipped=false;setMode("card")};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if(mode==="card"){
    if(e.key===" "){e.preventDefault();flipped=!flipped;$("card").classList.toggle("flip",flipped)}
    else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);
    else if(e.key==="ArrowUp"){e.preventDefault();mark(true)}else if(e.key==="ArrowDown"){e.preventDefault();mark(false)}
    else if(e.key==="s"||e.key==="S"){const x=pool()[pos];if(x)speak(x)}
  }else if(mode==="quiz"&&qmode==="mc"){
    if(/^[1-4]$/.test(e.key))answer($("ans").children[+e.key-1]);
    else if(e.key==="Enter"||e.key==="ArrowRight")quiz();
  }
});
let sx=null,sy=null;
$("card").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$("card").addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){e.preventDefault();go(dx<0?1:-1)}sx=null},{passive:false});
try{speechSynthesis.getVoices()}catch(e){}
chips();render();
}
</script>
</body>
</html>
